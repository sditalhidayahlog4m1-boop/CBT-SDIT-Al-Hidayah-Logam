<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Inner Shield / Emblem Base -->
  <path d="M 256 60 C 370 60 410 110 410 240 C 410 360 256 430 256 430 C 256 430 102 360 102 240 C 102 110 142 60 256 60 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Crescent and Star (Islamic Education Crest) -->
  <g transform="translate(256, 128) scale(0.95)">
    <!-- Crescent -->
    <path d="M 0 -36 A 36 36 0 1 0 32 20 A 30 30 0 1 1 -10 -30 A 36 36 0 0 0 0 -36 Z" fill="url(#goldGrad)" />
    <!-- Center Star -->
    <polygon points="12,-16 16,-5 27,-5 18,2 21,13 12,6 3,13 6,2 -3,-5 8,-5" fill="url(#goldGrad)" />
  </g>

  <!-- Open Al-Qur'an / Book of Knowledge -->
  <g transform="translate(256, 260) scale(1.1)">
    <!-- Left Page -->
    <path d="M -8 18 C -45 5 -85 12 -100 20 C -102 21 -104 20 -104 17 L -104 -45 C -104 -47 -102 -49 -99 -50 C -85 -55 -45 -60 -8 -45 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Right Page -->
    <path d="M 8 18 C 45 5 85 12 100 20 C 102 21 104 20 104 17 L 104 -45 C 104 -47 102 -49 99 -50 C 85 -55 45 -60 8 -45 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
    <!-- Center Spine & Ribbon -->
    <path d="M -8 -45 Q 0 -50 8 -45 L 8 20 Q 0 15 -8 20 Z" fill="url(#goldGrad)" />
    <!-- Page text lines (Abstract) -->
    <line x1="-88" y1="-32" x2="-24" y2="-28" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="-88" y1="-18" x2="-24" y2="-14" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-88" y1="-4" x2="-24" y2="0" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-88" y1="10" x2="-40" y2="12" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />

    <line x1="24" y1="-28" x2="88" y2="-32" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="24" y1="-14" x2="88" y2="-18" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="0" x2="88" y2="-4" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="40" y1="12" x2="88" y2="10" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bookmark Ribbon Hanging Down -->
    <path d="M -3 18 L 3 18 L 6 42 L 0 36 L -6 42 Z" fill="#ef4444" />
  </g>

  <!-- Banner / Ribbon at Bottom -->
  <g transform="translate(256, 385)">
    <!-- Ribbon Shadow & Body -->
    <path d="M -160 0 L -120 -18 L 120 -18 L 160 0 L 140 32 L 110 20 L -110 20 L -140 32 Z" fill="#047857" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Main Center Banner -->
    <rect x="-135" y="-14" width="270" height="34" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <!-- School Initials Banner Text -->
    <text x="0" y="10" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#064e3b" text-anchor="middle" letter-spacing="2">
      SDIT AL HIDAYAH
    </text>
  </g>

  <!-- Sub-Badge Text "LOGAM" -->
  <g transform="translate(256, 442)">
    <rect x="-46" y="-12" width="92" height="22" rx="11" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="3" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#fbbf24" text-anchor="middle" letter-spacing="2">
      LOGAM
    </text>
  </g>

  <!-- Small Stars on Inner Circle -->
  <circle cx="95" cy="180" r="4" fill="#fbbf24" />
  <circle cx="75" cy="240" r="5" fill="#fbbf24" />
  <circle cx="95" cy="300" r="4" fill="#fbbf24" />

  <circle cx="417" cy="180" r="4" fill="#fbbf24" />
  <circle cx="437" cy="240" r="5" fill="#fbbf24" />
  <circle cx="417" cy="300" r="4" fill="#fbbf24" />
</svg>
